<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Papan Tulis Interaktif - Fisika UNSERA">
    <title>Chalkboard Workspace - Fisika UNSERA</title>

    <!-- Tailwind CSS -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->

    <!-- Tailwind CSS -->
    <script src="../../static/js/tailwindcss/tailwindcss.js"></script>

    <script>
        tailwind.config = {
            darkMode: ['class'],
            theme: {
                extend: {
                    colors: {
                        'chalk-green': '#1e402d',
                        'chalk-border': '#3d2516',
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Alpine.js (Untuk Dropdown Interaktif) -->
    <!-- <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script> -->

    <!-- Alpine Plugins LOKAL (Harus dipanggil SEBELUM Alpine core) -->
    <script defer src="../../static/js/alpine-collapse.min.js"></script>

    <!-- Alpine.js CSP -->
    <script defer src="../../static/js/alpine.min.js"></script>

    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Setup PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 240 10% 3.9%;
            --border: 240 5.9% 90%;
            --muted: 240 4.8% 95.9%;
            --muted-foreground: 240 3.8% 46.1%;
        }
        .dark {
            --background: 240 10% 3.9%;
            --foreground: 0 0% 98%;
            --border: 240 3.7% 15.9%;
            --muted: 240 3.7% 15.9%;
            --muted-foreground: 240 5% 64.9%;
        }

        /* Container Utama */
        .board-canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }
        
        .board-light { background-color: #ffffff; }
        .dark .board-dark { background-color: #1e402d; }

        /* Canvas Piksel (Hanya untuk Coretan) */
        canvas {
            position: absolute;
            top: 0; left: 0;
            display: block;
            width: 100%; height: 100%;
            cursor: crosshair;
            z-index: 10;
        }

        /* Overlay Teks */
        #text-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none; 
        }

        /* Styling Elemen Teks */
        .canvas-text-input {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed transparent;
            border-radius: 4px;
            outline: none;
            font-family: sans-serif;
            padding: 4px;
            min-width: 30px;
            min-height: 30px;
            resize: none !important; /* Nonaktifkan native resize bawaan browser */
            overflow: hidden;
            line-height: 1.2;
            pointer-events: auto; 
            transition: background-color 0.2s;
        }

        /* Tampilan saat aktif/tidak aktif */
        .tool-mode-text .canvas-text-input,
        .tool-mode-select .canvas-text-input {
            border-color: rgba(136, 136, 136, 0.4);
        }

        .tool-mode-text .canvas-text-input:focus,
        .tool-mode-select .canvas-text-input.active-text-element {
            /* Sembunyikan border bawaan karena akan diganti oleh Transform Box */
            border-color: transparent !important; 
            background: rgba(255, 255, 255, 0.1);
        }

        .tool-mode-select .canvas-text-input {
            cursor: move;
            user-select: none;
        }

        /* CUSTOM TRANSFORM BOX (Bingkai Interaktif + Handle 8 titik) */
        #transform-box {
            position: absolute;
            border: 1.5px solid #3b82f6;
            z-index: 30;
            pointer-events: none; /* Klik tembus ke teks di bawahnya */
            display: none;
        }
        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border: 1.5px solid #3b82f6;
            border-radius: 2px;
            pointer-events: auto; /* Bisa diklik/drag */
        }
        .resize-handle:hover { background-color: #eff6ff; }
        
        /* Posisi 8 Tuas Resize */
        .resize-handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .resize-handle.n  { top: -6px; left: calc(50% - 6px); cursor: ns-resize; }
        .resize-handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .resize-handle.e  { top: calc(50% - 6px); right: -6px; cursor: ew-resize; }
        .resize-handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }
        .resize-handle.s  { bottom: -6px; left: calc(50% - 6px); cursor: ns-resize; }
        .resize-handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .resize-handle.w  { top: calc(50% - 6px); left: -6px; cursor: ew-resize; }

        /* Styling Toolbar */
        .toolbar-expanded {
            /* Kurangi lebar maksimal untuk memberi ruang bagi tombol toggle (sekitar 4rem / 64px) */
            max-width: calc(95vw - 4rem) !important; 
            opacity: 1 !important;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            margin-left: 0.5rem;
        }
        @media (min-width: 640px) {
            .toolbar-expanded { max-width: 700px !important; }
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track {
            height: 4px; background: hsl(var(--border)); border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px;
            border-radius: 50%; background: hsl(var(--foreground));
            margin-top: -6px; cursor: ew-resize;
        }
    </style>
</head>

<body class="h-[100dvh] w-screen flex flex-col bg-[hsl(var(--background))] text-[hsl(var(--foreground))] transition-colors duration-300 overflow-hidden">

    <!-- HEADER: Navigasi Board -->

        <div class="flex items-center gap-2 sm:gap-3">
            <!-- Tombol Back ke Home dengan URL Dinamis Alpine.js -->

            >

        </div>

        <div class="flex items-center bg-[hsl(var(--muted))] border border-[hsl(var(--border))] rounded-md p-1">
            <button onclick="prevBoard()" class="inline-flex items-center justify-center h-8 w-8 rounded-sm text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--background))] hover:text-[hsl(var(--foreground))] hover:shadow-sm transition-all disabled:opacity-50" id="btn-prev">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <div class="px-2 sm:px-4 text-sm font-medium tabular-nums flex items-center justify-center min-w-[80px] sm:min-w-[90px]">
                Board <span id="current-board-label" class="ml-1 mr-1">1</span> / 30
            </div>
            <button onclick="nextBoard()" class="inline-flex items-center justify-center h-8 w-8 rounded-sm text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--background))] hover:text-[hsl(var(--foreground))] hover:shadow-sm transition-all disabled:opacity-50" id="btn-next">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
        </div>
        
        <div class="flex justify-end items-center gap-2">

            <!-- Input File & Tombol Upload -->
            <input type="file" id="upload-file" accept="image/*,.pdf" class="hidden" onchange="handleFileUpload(event)">
            <button onclick="document.getElementById('upload-file').click()" class="inline-flex items-center justify-center h-9 px-3 sm:px-4 rounded-md text-sm font-medium border border-[hsl(var(--border))] bg-transparent hover:bg-[hsl(var(--muted))] transition-colors">
                <i data-lucide="upload" class="w-4 h-4 sm:mr-2"></i> <span class="hidden sm:inline">Upload PDF</span>
            </button>

            <button onclick="clearBoard()" class="inline-flex items-center justify-center h-9 px-3 sm:px-4 rounded-md text-sm font-medium border border-[hsl(var(--border))] bg-transparent hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-950/30 dark:hover:text-red-400 transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4 sm:mr-2"></i> <span class="hidden sm:inline">Bersihkan</span>
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <main class="flex-1 w-full relative overflow-hidden flex flex-col pt-4 pb-[5.5rem] sm:pt-6 sm:pb-24 bg-[hsl(var(--muted))]">
        
        <!-- Kontrol Halaman PDF (Desain Floating Pill Responsif) -->
        <div id="pdf-controls" class="hidden absolute bottom-24 sm:bottom-28 lg:bottom-auto lg:top-6 left-1/2 -translate-x-1/2 z-40 items-center gap-1.5 bg-[hsl(var(--background))] border border-[hsl(var(--border))] shadow-md rounded-full px-3 py-1.5 transition-all">
            <div class="flex items-center justify-center text-red-500 mr-1" title="PDF Mode Aktif">
                <i data-lucide="file-text" class="w-4 h-4"></i>
            </div>
            <button onclick="prevPdfPage()" class="inline-flex items-center justify-center h-8 w-8 rounded-full bg-[hsl(var(--muted))] text-[hsl(var(--foreground))] hover:opacity-80 active:scale-95 transition-all shadow-sm">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <span id="pdf-page-num" class="text-sm font-bold px-2 tabular-nums text-center min-w-[3.5rem]">1 / 1</span>
            <button onclick="nextPdfPage()" class="inline-flex items-center justify-center h-8 w-8 rounded-full bg-[hsl(var(--muted))] text-[hsl(var(--foreground))] hover:opacity-80 active:scale-95 transition-all shadow-sm">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="board-canvas-wrapper board-light board-dark border-y-[10px] sm:border-y-[14px] md:border-y-[16px] border-x-0 border-chalk-border shadow-2xl flex-1 w-full" id="canvas-container">
            <canvas id="chalkboard" class="dark:invert"></canvas>
            <div id="text-overlay"></div>
            
            <!-- Transform Box (Bingkai Resize) -->
            <div id="transform-box">
                <div class="resize-handle nw" data-dir="nw"></div>
                <div class="resize-handle n" data-dir="n"></div>
                <div class="resize-handle ne" data-dir="ne"></div>
                <div class="resize-handle e" data-dir="e"></div>
                <div class="resize-handle se" data-dir="se"></div>
                <div class="resize-handle s" data-dir="s"></div>
                <div class="resize-handle sw" data-dir="sw"></div>
                <div class="resize-handle w" data-dir="w"></div>
            </div>
        </div>
    </main>

    <!-- FLOATING TOOLBAR -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center p-1 rounded-full border border-[hsl(var(--border))] bg-[hsl(var(--background))] shadow-xl transition-all duration-300 max-w-[95vw]">
        
        <button onclick="toggleToolbar()" id="btn-toggle-toolbar" class="relative inline-flex items-center justify-center w-12 h-12 rounded-full bg-[hsl(var(--foreground))] text-[hsl(var(--background))] hover:opacity-90 transition-transform active:scale-95 z-20 shrink-0 shadow-sm">
            <i data-lucide="more-horizontal" id="icon-menu" class="w-6 h-6 absolute transition-all duration-300"></i>
            <i data-lucide="x" id="icon-close" class="w-6 h-6 absolute opacity-0 scale-50 transition-all duration-300"></i>
        </button>

        <div id="expandable-tools" class="flex items-center max-w-0 opacity-0 px-0 overflow-x-auto hide-scrollbar transition-all duration-500 ease-in-out gap-1 z-10 shrink-0 scroll-smooth">
            
            <button onclick="setTool('select')" id="tool-select" class="tool-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Kursor / Geser Teks (V)">
                <i data-lucide="mouse-pointer-2" class="w-5 h-5"></i>
            </button>

            <button onclick="setTool('pen')" id="tool-pen" class="tool-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Pulpen (P)">
                <i data-lucide="pen" class="w-5 h-5"></i>
            </button>
            <button onclick="setTool('text')" id="tool-text" class="tool-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Teks Baru (T)">
                <i data-lucide="keyboard" class="w-5 h-5"></i>
            </button>
            <button onclick="setTool('rect')" id="tool-rect" class="tool-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Kotak (R)">
                <i data-lucide="square" class="w-5 h-5"></i>
            </button>
            <button onclick="setTool('circle')" id="tool-circle" class="tool-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Lingkaran (C)">
                <i data-lucide="circle" class="w-5 h-5"></i>
            </button>
            <button onclick="setTool('eraser')" id="tool-eraser" class="tool-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Penghapus (E)">
                <i data-lucide="eraser" class="w-5 h-5"></i>
            </button>

            <div class="w-[1px] h-6 bg-[hsl(var(--border))] mx-1 sm:mx-2 shrink-0"></div>

            <!-- SLIDER KETEBALAN PULPEN SAJA -->
            <div class="flex items-center gap-2 px-2 shrink-0" title="Ketebalan Pulpen">
                <i data-lucide="scaling" class="w-4 h-4 text-[hsl(var(--muted-foreground))]"></i>

            </div>
            
            <div class="w-[1px] h-6 bg-[hsl(var(--border))] mx-1 sm:mx-2 shrink-0"></div>

            <div class="w-[1px] h-6 bg-[hsl(var(--border))] mx-1 sm:mx-2 shrink-0"></div>

            <!-- TEMA -->
            <button onclick="setTheme('light')" id="btn-light" class="theme-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Light Mode">
                <i data-lucide="sun" class="h-4 w-4"></i>
            </button>
            <button onclick="setTheme('system')" id="btn-system" class="theme-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="System Mode">

            </button>
            <button onclick="setTheme('dark')" id="btn-dark" class="theme-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Dark Mode">
                <i data-lucide="moon" class="h-4 w-4"></i>
            </button>

    <!-- TOMBOL BACKUP & IMPORT (Kanan Bawah) -->
    <!-- Tambahkan id="backup-container" dan transition-all duration-300 -->
    <div id="backup-container" class="fixed bottom-6 right-4 sm:right-6 z-40 flex items-center gap-2 transition-all duration-300">
        <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
        
        <button onclick="document.getElementById('import-file').click()" class="inline-flex items-center justify-center h-12 w-12 sm:h-10 sm:w-auto sm:px-4 rounded-full bg-[hsl(var(--background))] border border-[hsl(var(--border))] text-[hsl(var(--foreground))] shadow-md hover:bg-[hsl(var(--muted))] transition-colors" title="Import File JSON">
            <i data-lucide="folder-up" class="w-5 h-5 sm:mr-2"></i> 
            <span class="hidden sm:inline text-sm font-medium">Import</span>
        </button>
        
        <button onclick="exportData()" class="inline-flex items-center justify-center h-12 w-12 sm:h-10 sm:w-auto sm:px-4 rounded-full bg-chalk-green text-white shadow-md hover:opacity-90 transition-colors" title="Backup ke JSON">
            <i data-lucide="save" class="w-5 h-5 sm:mr-2"></i> 
            <span class="hidden sm:inline text-sm font-medium">Backup</span>
        </button>
    </div>

    <!-- PENGATURAN UI TEMA DLL -->
    <script>
        lucide.createIcons();

        let isToolbarOpen = false;
        function toggleToolbar() {
            isToolbarOpen = !isToolbarOpen;
            const menuArea = document.getElementById('expandable-tools');
            const iconMenu = document.getElementById('icon-menu');
            const iconClose = document.getElementById('icon-close');
            const backupContainer = document.getElementById('backup-container');
            
            if (isToolbarOpen) {
                menuArea.classList.add('toolbar-expanded');
                iconMenu.classList.add('opacity-0', 'scale-50');
                iconClose.classList.remove('opacity-0', 'scale-50');
                
                // Sembunyikan tombol backup
                if(backupContainer) {
                    backupContainer.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                }
            } else {
                menuArea.classList.remove('toolbar-expanded');
                iconMenu.classList.remove('opacity-0', 'scale-50');
                iconClose.classList.add('opacity-0', 'scale-50');
                
                // Munculkan kembali tombol backup
                if(backupContainer) {
                    backupContainer.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                }
            }
        }

        function updateActiveThemeButton() {
            const theme = localStorage.getItem('theme') || 'system';
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
            });
            const activeBtn = document.getElementById(`btn-${theme}`);
            if (activeBtn) activeBtn.classList.add('bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
        }

        function setTheme(mode) {
            const html = document.documentElement;
            if (mode === 'system') {
                localStorage.removeItem('theme');
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) html.classList.add('dark');
                else html.classList.remove('dark');
            } else {
                localStorage.theme = mode;
                if (mode === 'dark') html.classList.add('dark');
                else html.classList.remove('dark');
            }
            updateActiveThemeButton();
            updateCanvasContextProps();
            
            const isDark = document.documentElement.classList.contains('dark');
            document.querySelectorAll('.canvas-text-input').forEach(ta => {
                ta.style.color = isDark ? '#f8fafc' : '#0f172a';
            });
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('theme')) {
                if (e.matches) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                updateCanvasContextProps();
            }
        });

        updateActiveThemeButton();
    </script>

    <!-- SCRIPT BLOKIR ZOOM -->
    <script>
        // 1. Blokir zoom dari Keyboard (Ctrl/Cmd + Plus/Minus/Nol)
        window.addEventListener('keydown', function (e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
                e.preventDefault();
            }
        });

        // 2. Blokir zoom dari Mouse Wheel atau Trackpad (Ctrl/Cmd + Scroll)
        window.addEventListener('wheel', function (e) {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
            }
        }, { passive: false });

        // 3. Blokir Pinch-to-Zoom (Cubit) di Mobile/Tablet
        document.addEventListener('touchmove', function (e) {
            // Mencegah zoom jika ada lebih dari 1 jari (cubitan)
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // 4. Blokir Gesture khusus Safari (Mac/iOS) yang sering mengabaikan meta tag
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });
        document.addEventListener('gesturechange', function (e) {
            e.preventDefault();
        });
        document.addEventListener('gestureend', function (e) {
            e.preventDefault();
        });
        
        // 5. Blokir double-tap to zoom pada iOS Safari
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>

    <!-- LOGIKA PAPAN TULIS & TEKS HTML OVERLAY -->
    <script>
        const canvas = document.getElementById('chalkboard');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('canvas-container');
        const textOverlay = document.getElementById('text-overlay');
        const transformBox = document.getElementById('transform-box');

        const MAX_BOARDS = 30;
        let currentBoardIndex = 0;
        // Tambahkan pdfStates: {} untuk menampung coretan per halaman PDF
        const boardsData = new Array(MAX_BOARDS).fill(null).map(() => ({ img: null, html: '', pdfStates: {} }));

        let isDrawing = false;
        let currentTool = 'pen';
        let startX, startY;
        let snapshot; 
        let strokePoints = [];

        // Font & State Management
        let activeTextElement = null;
        let currentDefaultFontSize = 24;

        function applyCanvasSize() {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            if (canvas.width === newWidth && canvas.height === newHeight) return;

            const currentImgData = canvas.toDataURL(); 
            canvas.width = newWidth;
            canvas.height = newHeight;
            updateCanvasContextProps();
            
            if (currentImgData !== "data:,") {
                const img = new Image();
                img.src = currentImgData;
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                    saveBoardState(); 
                };
            }
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(applyCanvasSize, 150);
            updateTransformBox();
        });
        
        function updateCanvasContextProps() {
            const toolSize = parseInt(document.getElementById('tool-size').value);
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = "destination-out";
                ctx.lineWidth = toolSize * 5; 
            } else {
                ctx.globalCompositeOperation = "source-over";
                ctx.lineWidth = toolSize;
                // Selalu gambar dengan warna hitam pekat. 
                // Saat mode gelap, class 'dark:invert' akan mengubahnya menjadi putih murni secara otomatis.
                ctx.strokeStyle = '#000000'; 
            }
        }

        // Toggles Transform Box Size and Visibility
        function updateTransformBox() {
            if (activeTextElement && (currentTool === 'select' || currentTool === 'text')) {
                transformBox.style.display = 'block';
                transformBox.style.left = activeTextElement.style.left;
                transformBox.style.top = activeTextElement.style.top;
                transformBox.style.width = activeTextElement.offsetWidth + 'px';
                transformBox.style.height = activeTextElement.offsetHeight + 'px';
            } else {
                transformBox.style.display = 'none';
            }
        }

        // Toggles State untuk Font Button & Transform Box
        function updateFontButtonsState() {
            const minusBtn = document.getElementById('btn-font-minus');
            const plusBtn = document.getElementById('btn-font-plus');
            
            document.querySelectorAll('.canvas-text-input').forEach(ta => ta.classList.remove('active-text-element'));
            
            if (activeTextElement) {
                activeTextElement.classList.add('active-text-element');
                minusBtn.disabled = false;
                plusBtn.disabled = false;
                minusBtn.classList.add('hover:bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
                plusBtn.classList.add('hover:bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
            } else {
                minusBtn.disabled = true;
                plusBtn.disabled = true;
                minusBtn.classList.remove('hover:bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
                plusBtn.classList.remove('hover:bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
            }
            updateTransformBox();
        }

        function changeFontSize(delta) {
            if (!activeTextElement) return;
            let currentSize = parseInt(window.getComputedStyle(activeTextElement).fontSize) || currentDefaultFontSize;
            let newSize = Math.max(12, Math.min(120, currentSize + delta));
            activeTextElement.style.fontSize = newSize + 'px';
            currentDefaultFontSize = newSize; 
            saveBoardState();
            updateTransformBox();
        }

        ['mousedown', 'touchstart'].forEach(evt => {
            document.getElementById('btn-font-minus').addEventListener(evt, (e) => {
                e.preventDefault(); 
                changeFontSize(-4);
            });
            document.getElementById('btn-font-plus').addEventListener(evt, (e) => {
                e.preventDefault(); 
                changeFontSize(4);
            });
        });

        // TOOL UI UPDATE
        function setTool(tool) {
            currentTool = tool;
            
            container.className = container.className.replace(/tool-mode-\w+/g, '');
            container.classList.add(`tool-mode-${tool}`);

            document.querySelectorAll('.canvas-text-input').forEach(ta => {
                ta.readOnly = (tool !== 'text');
            });

            if (tool === 'select' || tool === 'text') {
                textOverlay.style.pointerEvents = 'auto';
            } else {
                textOverlay.style.pointerEvents = 'none';
                activeTextElement = null; // Reset saat switch alat pen/penghapus
                updateFontButtonsState();
            }

            updateCanvasContextProps();
            updateTransformBox();

            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
                btn.classList.add('text-[hsl(var(--muted-foreground))]');
            });
            const activeBtn = document.getElementById(`tool-${tool}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-[hsl(var(--muted-foreground))]');
                activeBtn.classList.add('bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
            }
        }

        const getClientPos = (e) => e.touches && e.touches.length > 0 ? e.touches[0] : e;
        const getMousePos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const pos = getClientPos(e);
            return { x: pos.clientX - rect.left, y: pos.clientY - rect.top };
        };

        // BIND EVENT UNTUK TEKS (Agar Disimpan & Fokus)
        function bindTextEvents(element) {
            element.addEventListener('input', (e) => {
                e.target.textContent = e.target.value;
                updateTransformBox();
                saveBoardState();
            });
            
            element.addEventListener('focus', (e) => {
                activeTextElement = e.target;
                updateFontButtonsState();
            });
            
            element.addEventListener('blur', (e) => {
                setTimeout(() => {
                    // Cek jika blur bukan karena menekan handle transform box
                    if (document.activeElement !== element && activeTextElement === element) {
                        activeTextElement = null;
                        updateFontButtonsState();
                    }
                }, 150);

                if(e.target.value.trim() === '') {
                    e.target.remove(); 
                    saveBoardState();
                    updateTransformBox();
                }
            });
        }


        // ==========================================
        // FITUR DRAG (MENGGESER KOTAK TEKS)
        // ==========================================
        let isDraggingItem = false;
        let dragTarget = null;
        let dragOffX = 0, dragOffY = 0;

        textOverlay.addEventListener('mousedown', handleDragStart);
        textOverlay.addEventListener('touchstart', handleDragStart, { passive: false });

        function handleDragStart(e) {
            if (currentTool === 'select' && e.target.classList.contains('canvas-text-input')) {
                activeTextElement = e.target;
                updateFontButtonsState();
                
                // Paksa fokus agar input text tidak kehilangan state 'active' 
                e.target.focus(); 

                isDraggingItem = true;
                dragTarget = e.target;
                
                const containerRect = container.getBoundingClientRect();
                const pos = getClientPos(e);
                const mouseX = pos.clientX - containerRect.left;
                const mouseY = pos.clientY - containerRect.top;
                
                dragOffX = mouseX - parseFloat(dragTarget.style.left || 0);
                dragOffY = mouseY - parseFloat(dragTarget.style.top || 0);
            }
        }


        // ==========================================
        // FITUR RESIZE (MEMPERBESAR AREA DARI 8 SISI)
        // ==========================================
        let isResizing = false;
        let resizeDir = '';
        let startBoxW = 0, startBoxH = 0, startBoxX = 0, startBoxY = 0;
        let startMouseX = 0, startMouseY = 0;

        transformBox.addEventListener('mousedown', handleResizeStart);
        transformBox.addEventListener('touchstart', handleResizeStart, { passive: false });

        function handleResizeStart(e) {
            if (e.target.classList.contains('resize-handle')) {
                isResizing = true;
                resizeDir = e.target.getAttribute('data-dir');
                
                const pos = getClientPos(e);
                startMouseX = pos.clientX;
                startMouseY = pos.clientY;
                
                startBoxW = activeTextElement.offsetWidth;
                startBoxH = activeTextElement.offsetHeight;
                startBoxX = parseFloat(activeTextElement.style.left || 0);
                startBoxY = parseFloat(activeTextElement.style.top || 0);
                
                e.preventDefault(); 
                e.stopPropagation();
            }
        }

        // Global Mouse Move & End Event
        window.addEventListener('mousemove', handleGlobalMove);
        window.addEventListener('touchmove', handleGlobalMove, { passive: false });
        window.addEventListener('mouseup', handleGlobalEnd);
        window.addEventListener('touchend', handleGlobalEnd);

        function handleGlobalMove(e) {
            if (isDraggingItem && dragTarget) {
                const containerRect = container.getBoundingClientRect();
                const pos = getClientPos(e);
                const mouseX = pos.clientX - containerRect.left;
                const mouseY = pos.clientY - containerRect.top;
                
                dragTarget.style.left = (mouseX - dragOffX) + 'px';
                dragTarget.style.top = (mouseY - dragOffY) + 'px';
                updateTransformBox();
                e.preventDefault();
            } 
            else if (isResizing && activeTextElement) {
                const pos = getClientPos(e);
                const dx = pos.clientX - startMouseX;
                const dy = pos.clientY - startMouseY;
                
                let newW = startBoxW;
                let newH = startBoxH;
                let newX = startBoxX;
                let newY = startBoxY;

                if (resizeDir.includes('e')) newW = startBoxW + dx;
                if (resizeDir.includes('s')) newH = startBoxH + dy;
                if (resizeDir.includes('w')) { newW = startBoxW - dx; newX = startBoxX + dx; }
                if (resizeDir.includes('n')) { newH = startBoxH - dy; newY = startBoxY + dy; }

                // Batas ukuran minimal (px)
                const minSize = 30;
                if (newW < minSize) {
                    if (resizeDir.includes('w')) newX -= (minSize - newW);
                    newW = minSize;
                }
                if (newH < minSize) {
                    if (resizeDir.includes('n')) newY -= (minSize - newH);
                    newH = minSize;
                }

                activeTextElement.style.width = newW + 'px';
                activeTextElement.style.height = newH + 'px';
                activeTextElement.style.left = newX + 'px';
                activeTextElement.style.top = newY + 'px';
                
                updateTransformBox();
                e.preventDefault();
            }
        }

        function handleGlobalEnd() {
            let stateChanged = false;
            if (isDraggingItem) {
                isDraggingItem = false;
                dragTarget = null;
                stateChanged = true;
            }
            if (isResizing) {
                isResizing = false;
                stateChanged = true;
                // Tetap fokus ke text setelah selesai resize
                if(activeTextElement) activeTextElement.focus();
            }
            if (stateChanged) saveBoardState();
        }

        
        // ==========================================
        // MOUSE/TOUCH CANVAS CORE
        // ==========================================
        const startDraw = (e) => {
            const pos = getMousePos(e);
            
            // JIKA MENGGUNAKAN TOOL SELECT KURSOR
            if (currentTool === 'select') {
                if (!e.target.classList.contains('canvas-text-input') && !e.target.classList.contains('resize-handle')) {
                    activeTextElement = null;
                    updateFontButtonsState();
                }
                return;
            }

            if (currentTool === 'text') {
                if (e.target.classList.contains('canvas-text-input')) return; 
                
                const input = document.createElement('textarea');
                input.className = 'canvas-text-input';
                
                input.style.fontSize = currentDefaultFontSize + 'px';
                
                // Set ukuran box awal
                input.style.width = '150px';
                input.style.height = '50px';

                input.style.left = pos.x + 'px';
                input.style.top = pos.y + 'px'; 
                
                const isDark = document.documentElement.classList.contains('dark');
                input.style.color = isDark ? '#f8fafc' : '#0f172a';
                
                textOverlay.appendChild(input);
                bindTextEvents(input);
                
                setTimeout(() => input.focus(), 10);
                saveBoardState();
                
                e.preventDefault();
                return;
            }

            isDrawing = true;
            startX = pos.x;
            startY = pos.y;

            strokePoints = [{x: startX, y: startY}]; // Reset dan simpan titik awal

            // (Lanjutkan dengan kode ctx.beginPath() yang sudah ada)
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            
            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            e.preventDefault();
        };

        const draw = (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);

            if (currentTool === 'eraser') {
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
                
                const targetHTML = document.elementFromPoint(getClientPos(e).clientX, getClientPos(e).clientY);
                if (targetHTML && targetHTML.classList.contains('canvas-text-input')) {
                    targetHTML.remove();
                    updateTransformBox();
                }
            } else if (currentTool === 'pen') {
                strokePoints.push({x: pos.x, y: pos.y}); // Simpan titik untuk dianalisis
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentTool === 'rect' || currentTool === 'circle') {
                ctx.putImageData(snapshot, 0, 0);
                ctx.beginPath();
                if (currentTool === 'rect') {
                    ctx.rect(startX, startY, pos.x - startX, pos.y - startY);
                } else if (currentTool === 'circle') {
                    const radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
                    ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                }
                ctx.stroke();
            }
            e.preventDefault();
        };

        const stopDraw = (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            
            // Panggil logika Shape Recognizer khusus untuk alat pena
            if (currentTool === 'pen') {
                recognizeAndCorrectShape(strokePoints);
            }
            
            saveBoardState();
        };

        // FUNGSI INI SEBELUM event listener (container.addEventListener...)
        function recognizeAndCorrectShape(points) {
            if (points.length < 15) return; // Abaikan jika coretan terlalu pendek (hanya titik)

            const start = points[0];
            const end = points[points.length - 1];
            
            // Hitung jarak garis lurus dari awal ke akhir
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const startEndDist = Math.sqrt(dx * dx + dy * dy);

            // Hitung panjang total coretan berliku dan Bounding Box
            let pathLength = 0;
            let minX = start.x, maxX = start.x, minY = start.y, maxY = start.y;

            for (let i = 1; i < points.length; i++) {
                const p1 = points[i - 1];
                const p2 = points[i];
                pathLength += Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
                
                if (p2.x < minX) minX = p2.x;
                if (p2.x > maxX) maxX = p2.x;
                if (p2.y < minY) minY = p2.y;
                if (p2.y > maxY) maxY = p2.y;
            }

            const width = maxX - minX;
            const height = maxY - minY;
            const boundingBoxDiagonal = Math.sqrt(width * width + height * height);

            // 1. DETEKSI GARIS LURUS (Straight Line)
            // Jika jarak ditarik lurus hampir sama dengan total jarak coretan (akurasi > 92%)
            if (startEndDist / pathLength > 0.92) {
                ctx.putImageData(snapshot, 0, 0); // Hapus coretan berantakan
                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                ctx.lineTo(end.x, end.y);
                ctx.stroke();
                return; // Selesai perbaiki garis
            }

            // 2. DETEKSI BENTUK TERTUTUP (Lingkaran atau Kotak)
            // Jika titik awal dan titik akhir bertemu/berdekatan
            if (startEndDist / boundingBoxDiagonal < 0.15) {
                const centerX = minX + width / 2;
                const centerY = minY + height / 2;
                
                // Hitung standar deviasi jarak titik ke pusat
                let avgRadius = 0;
                points.forEach(p => {
                    avgRadius += Math.sqrt(Math.pow(p.x - centerX, 2) + Math.pow(p.y - centerY, 2));
                });
                avgRadius /= points.length;

                let variance = 0;
                points.forEach(p => {
                    const r = Math.sqrt(Math.pow(p.x - centerX, 2) + Math.pow(p.y - centerY, 2));
                    variance += Math.pow(r - avgRadius, 2);
                });
                const stdDev = Math.sqrt(variance / points.length);

                // A. Deteksi Lingkaran (Deviasi radius ke pusat sangat kecil/konsisten)
                if (stdDev / avgRadius < 0.15) {
                    ctx.putImageData(snapshot, 0, 0);
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, avgRadius, 0, 2 * Math.PI);
                    ctx.stroke();
                    return;
                }

                // B. Deteksi Kotak (Deviasi lebih besar karena ada sudut-sudut)
                if (stdDev / avgRadius >= 0.15 && width > 10 && height > 10) {
                    ctx.putImageData(snapshot, 0, 0);
                    ctx.beginPath();
                    ctx.rect(minX, minY, width, height);
                    ctx.stroke();
                    return;
                }
            }
        }

        container.addEventListener('mousedown', startDraw);
        container.addEventListener('mousemove', draw);
        container.addEventListener('mouseup', stopDraw);
        container.addEventListener('mouseout', stopDraw);

        container.addEventListener('touchstart', startDraw, { passive: false });
        container.addEventListener('touchmove', draw, { passive: false });
        container.addEventListener('touchend', stopDraw);

        // ==========================================
        // FUNGSI PENYIMPANAN AMAN (ANTI QUOTA EXCEEDED)
        // ==========================================
        function safeSaveToLocalStorage() {
            try {
                localStorage.setItem('chalkboard_backup', JSON.stringify(boardsData));
            } catch (e) {
                // Jika error karena kapasitas LocalStorage penuh
                if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22) {
                    console.warn("LocalStorage penuh! Menghapus data papan yang sudah dilewati...");
                    
                    // 1. Kosongkan semua data papan KECUALI papan yang sedang aktif saat ini
                    for (let i = 0; i < MAX_BOARDS; i++) {
                        if (i !== currentBoardIndex) {
                            boardsData[i] = { img: null, html: '', pdfStates: {} };
                        }
                    }

                    // 2. Jika sedang membuka PDF, hapus juga coretan di halaman PDF lain (sisakan halaman aktif)
                    if (pdfBoardIndex !== -1 && currentPdfName && boardsData[currentBoardIndex].pdfStates[currentPdfName]) {
                        const activePdfState = boardsData[currentBoardIndex].pdfStates[currentPdfName][currentPdfPage];
                        boardsData[currentBoardIndex].pdfStates = {}; // Hapus semua state PDF
                        
                        if (activePdfState) {
                            // Kembalikan hanya state halaman yang sedang terbuka
                            boardsData[currentBoardIndex].pdfStates[currentPdfName] = {
                                [currentPdfPage]: activePdfState
                            };
                        }
                    }

                    // 3. Coba simpan kembali setelah data lama dibersihkan
                    try {
                        localStorage.setItem('chalkboard_backup', JSON.stringify(boardsData));
                        console.log("Berhasil menyimpan setelah pembersihan memori.");
                    } catch (err) {
                        console.error("Gagal total menyimpan ke memori:", err);
                        alert("Memori browser sangat penuh, tidak bisa menyimpan perubahan otomatis.");
                    }
                } else {
                    console.error("Terjadi kesalahan LocalStorage:", e);
                }
            }
        }

        // ==========================================
        // BOARD MANAGEMENT LOGIC 
        // ==========================================
        function saveBoardState() {
            document.querySelectorAll('#text-overlay textarea').forEach(ta => {
                ta.textContent = ta.value;
            });
            
            // PERBAIKAN: Update nilai tanpa merusak struktur objek pdfStates
            if (!boardsData[currentBoardIndex]) {
                boardsData[currentBoardIndex] = { img: null, html: '', pdfStates: {} };
            }
            
            boardsData[currentBoardIndex].img = canvas.toDataURL();
            boardsData[currentBoardIndex].html = textOverlay.innerHTML; 

            // SIMPAN KE LOCALSTORAGE SECARA OTOMATIS (Gunakan fungsi aman)
            safeSaveToLocalStorage();
        }

        function restoreBoardState(data) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (data) {
                if (data.img && data.img !== "data:,") {
                    const img = new Image();
                    img.src = data.img;
                    img.onload = () => ctx.drawImage(img, 0, 0);
                }
                textOverlay.innerHTML = data.html || '';
                
                document.querySelectorAll('#text-overlay textarea').forEach(ta => {
                    ta.value = ta.textContent; 
                    bindTextEvents(ta);
                    ta.readOnly = (currentTool !== 'text');
                });
            } else {
                textOverlay.innerHTML = '';
            }
            activeTextElement = null;
            updateFontButtonsState();
        }

        function updateBoardUI() {
            document.getElementById('current-board-label').innerText = currentBoardIndex + 1;
            document.getElementById('btn-prev').disabled = currentBoardIndex === 0;
            document.getElementById('btn-next').disabled = currentBoardIndex === MAX_BOARDS - 1;

            // --- Logika untuk menyembunyikan/menampilkan kontrol PDF ---
            const pdfControls = document.getElementById('pdf-controls');
            if (pdfControls) {
                // Hanya tampilkan jika kita berada di board tempat PDF di-upload
                if (currentBoardIndex === pdfBoardIndex && currentPdfDoc !== null) {
                    pdfControls.classList.remove('hidden');
                    pdfControls.classList.add('flex');
                } else {
                    pdfControls.classList.remove('flex');
                    pdfControls.classList.add('hidden');
                }
            }
        }

        function nextBoard() {
            if (currentBoardIndex < MAX_BOARDS - 1) {
                saveBoardState();
                currentBoardIndex++;
                restoreBoardState(boardsData[currentBoardIndex]);
                updateBoardUI();
            }
        }

        function prevBoard() {
            if (currentBoardIndex > 0) {
                saveBoardState();
                currentBoardIndex--;
                restoreBoardState(boardsData[currentBoardIndex]);
                updateBoardUI();
            }
        }

        function clearBoard(skipConfirm = false) {
            // Jika skipConfirm bernilai false (tombol tong sampah ditekan), munculkan popup
            if (!skipConfirm) {
                const isConfirm = confirm("Apakah Anda ingin mem-backup data ke JSON sebelum membersihkan papan?");
                if (isConfirm) {
                    exportData();
                }
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            textOverlay.innerHTML = '';
            saveBoardState(); // Otomatis menyimpan state kosong ke localStorage
            activeTextElement = null;
            updateFontButtonsState();
        }

        // ==========================================
        // FITUR BACKUP (EXPORT) & RESTORE (IMPORT)
        // ==========================================
        function exportData() {
            saveBoardState(); // Pastikan state terbaru tersimpan
            const dataStr = JSON.stringify(boardsData);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            
            // Generate format tanggal-bulan-tahun (DD-MM-YYYY)
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0'); // Bulan dimulai dari 0
            const yyyy = today.getFullYear();
            
            const exportFileDefaultName = `${dd}-${mm}-${yyyy}.json`;
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (Array.isArray(importedData)) {
                        for (let i = 0; i < MAX_BOARDS; i++) {
                            boardsData[i] = importedData[i] || { img: null, html: '' };
                        }
                        // Update localstorage & papan saat ini
                        localStorage.setItem('chalkboard_backup', JSON.stringify(boardsData));
                        restoreBoardState(boardsData[currentBoardIndex]);
                        alert("Data JSON berhasil dipulihkan!");
                    } else {
                        alert("Format JSON tidak valid.");
                    }
                } catch (error) {
                    alert("Gagal membaca file JSON.");
                }
            };
            reader.readAsText(file);
            e.target.value = ''; // Reset input file
        }

        // ==========================================
        // FITUR UPLOAD & PDF VIEWER
        // ==========================================
        let currentPdfDoc = null;
        let currentPdfPage = 1;
        let pdfBoardIndex = -1;
        let currentPdfName = '';

        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type === 'application/pdf') {
                const fileReader = new FileReader();
                fileReader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    currentPdfDoc = await pdfjsLib.getDocument(typedarray).promise;
                    currentPdfPage = 1;
                    
                    // Simpan nama file PDF-nya
                    currentPdfName = file.name; 
                    
                    // Simpan indeks board tempat PDF ini di-upload
                    pdfBoardIndex = currentBoardIndex; 
                    
                    // Tampilkan kontrol PDF
                    document.getElementById('pdf-controls').classList.remove('hidden');
                    document.getElementById('pdf-controls').classList.add('flex');
                    
                    renderPdfPage(currentPdfPage);
                };
                fileReader.readAsArrayBuffer(file);
            }
            else if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const scale = Math.min((canvas.width * 0.9) / img.width, (canvas.height * 0.9) / img.height); 
                        const w = img.width * scale;
                        const h = img.height * scale;
                        const x = (canvas.width - w) / 2;
                        const y = (canvas.height - h) / 2;
                        ctx.drawImage(img, x, y, w, h);
                        saveBoardState();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            } 
            else {
                alert("Format file tidak didukung. Harap upload gambar (JPG/PNG) atau PDF.");
            }
            e.target.value = ''; // Reset
        }

        async function renderPdfPage(num) {
            if (!currentPdfDoc) return;
            
            // 1. Cek apakah halaman PDF ini sudah pernah dicoret/disimpan di localStorage BERDASARKAN NAMA FILE
            let savedState = null;
            if (boardsData[pdfBoardIndex].pdfStates[currentPdfName]) {
                savedState = boardsData[pdfBoardIndex].pdfStates[currentPdfName][num];
            }
            
            if (savedState && savedState.img) {
                // JIKA ADA: Kembalikan coretan dan gambar PDF dari penyimpanan tanpa overwrite
                restoreBoardState(savedState);
            } else {
                // Bersihkan layar sementara HANYA jika ini halaman yang belum pernah dibuka
                clearBoard(true); 

                // JIKA BELUM ADA CORETAN: Render murni dari file PDF
                const page = await currentPdfDoc.getPage(num);
                
                const viewport = page.getViewport({ scale: 1 });
                const scale = Math.min((canvas.width * 0.9) / viewport.width, (canvas.height * 0.9) / viewport.height);
                const scaledViewport = page.getViewport({ scale: scale });

                const offscreenCanvas = document.createElement('canvas');
                const offscreenCtx = offscreenCanvas.getContext('2d');
                offscreenCanvas.width = scaledViewport.width;
                offscreenCanvas.height = scaledViewport.height;

                const renderContext = {
                    canvasContext: offscreenCtx,
                    viewport: scaledViewport
                };
                
                await page.render(renderContext).promise;
                
                const x = (canvas.width - scaledViewport.width) / 2;
                const y = (canvas.height - scaledViewport.height) / 2;
                ctx.drawImage(offscreenCanvas, x, y);
                
                // Simpan kondisi papan aktif saat render baru selesai
                saveBoardState();
            }
            
            // Update UI teks halaman
            document.getElementById('pdf-page-num').textContent = `${num} / ${currentPdfDoc.numPages}`;
        }

        // Fungsi untuk menyimpan coretan halaman PDF secara spesifik
        function savePdfPageState() {
            if (pdfBoardIndex !== -1 && currentPdfDoc !== null && currentPdfName !== '') {
                // Pastikan teks terbaru masuk ke element
                document.querySelectorAll('#text-overlay textarea').forEach(ta => {
                    ta.textContent = ta.value;
                });
                
                // Buat ruang penyimpanan (object) untuk PDF ini jika belum pernah dibuat
                if (!boardsData[pdfBoardIndex].pdfStates[currentPdfName]) {
                    boardsData[pdfBoardIndex].pdfStates[currentPdfName] = {};
                }
                
                // Simpan canvas (PDF + Coretan) dan teks HTML ke state halaman PDF ini
                boardsData[pdfBoardIndex].pdfStates[currentPdfName][currentPdfPage] = {
                    img: canvas.toDataURL(),
                    html: textOverlay.innerHTML
                };
                
                // Simpan permanen ke localStorage (Gunakan fungsi aman)
                safeSaveToLocalStorage();
            }
        }

        function prevPdfPage() {
            if (currentPdfPage <= 1) return;
            savePdfPageState(); // Simpan coretan di halaman ini sebelum pindah
            currentPdfPage--;
            renderPdfPage(currentPdfPage);
        }

        function nextPdfPage() {
            if (currentPdfPage >= currentPdfDoc.numPages) return;
            savePdfPageState(); // Simpan coretan di halaman ini sebelum pindah
            currentPdfPage++;
            renderPdfPage(currentPdfPage);
        }

        // Shortcuts Keyboard
        window.addEventListener('keydown', (e) => {
            if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
            
            if (e.key.toLowerCase() === 'v') setTool('select');
            if (e.key.toLowerCase() === 'p') setTool('pen');
            if (e.key.toLowerCase() === 't') setTool('text');
            if (e.key.toLowerCase() === 'r') setTool('rect');
            if (e.key.toLowerCase() === 'c') setTool('circle');
            if (e.key.toLowerCase() === 'e') setTool('eraser');
            if (e.key === 'ArrowRight') nextBoard();
            if (e.key === 'ArrowLeft') prevBoard();
        });

        // INIT
        window.onload = () => {
            const savedData = localStorage.getItem('chalkboard_backup');
            if (savedData) {
                try {
                    const parsedData = JSON.parse(savedData);
                    for (let i = 0; i < MAX_BOARDS; i++) {
                        boardsData[i] = parsedData[i] || { img: null, html: '', pdfStates: {} };
                        // Pastikan properti pdfStates selalu ada agar tidak error
                        if (!boardsData[i].pdfStates) {
                            boardsData[i].pdfStates = {};
                        }
                    }
                } catch (e) {
                    console.error("Gagal memuat data dari localStorage", e);
                }
            }

            applyCanvasSize();
            setTool('pen');
            updateBoardUI();
            
            restoreBoardState(boardsData[currentBoardIndex]);
            
            if(window.lucide) lucide.createIcons();
        };
        
    </script>
</body>
</html>
