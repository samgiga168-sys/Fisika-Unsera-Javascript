<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Papan Tulis Interaktif - Fisika UNSERA">
    <title>Chalkboard Workspace - Fisika UNSERA</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class'],
            theme: {
                extend: {
                    colors: {
                        'chalk-green': '#1e402d',
                        'chalk-border': '#3d2516', /* Warna bingkai kayu */
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        muted: {
                            DEFAULT: "hsl(var(--muted))",
                            foreground: "hsl(var(--muted-foreground))",
                        },
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Variabel Warna Shadcn UI (Light & Dark) */
        :root {
            --background: 0 0% 100%;
            --foreground: 240 10% 3.9%;
            --border: 240 5.9% 90%;
            --muted: 240 4.8% 95.9%;
            --muted-foreground: 240 3.8% 46.1%;
        }
        .dark {
            --background: 240 10% 3.9%;
            --foreground: 0 0% 98%;
            --border: 240 3.7% 15.9%;
            --muted: 240 3.7% 15.9%;
            --muted-foreground: 240 5% 64.9%;
        }

        /* Wrapper Papan Tulis */
        .board-canvas-wrapper {
            position: relative;
            width: 100%;
            touch-action: none;
        }
        
        /* Tema Light: Whiteboard Bersih */
        .board-light {
            background-color: #ffffff;
        }

        /* Tema Dark: Chalkboard */
        .dark .board-dark {
            background-color: #1e402d; 
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        
        /* Animasi Transisi Toolbar & Scroll pada Mobile */
        .toolbar-expanded {
            max-width: 95vw !important; /* Adaptif untuk Mobile */
            opacity: 1 !important;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            margin-left: 0.5rem;
        }
        @media (min-width: 640px) {
            .toolbar-expanded {
                max-width: 800px !important; /* Adaptif untuk Desktop/Tablet */
            }
        }

        /* Menyembunyikan scrollbar di toolbar agar rapi */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Styling Input Ketik Teks & Kursor Resize */
        .canvas-text-input {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
            border: 2px dashed #888;
            outline: none;
            font-family: sans-serif;
            padding: 4px;
            z-index: 100;
            min-width: 120px;
            min-height: 40px;
            resize: both; /* Memberikan kursor drag untuk melebarkan di pojok kanan bawah */
            overflow: auto;
            line-height: 1.2;
        }
        .canvas-text-input:focus {
            border-color: #3b82f6; 
        }
        
        /* Custom styling range slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            height: 4px;
            background: hsl(var(--border));
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: hsl(var(--foreground));
            margin-top: -6px;
            cursor: ew-resize;
        }
    </style>

    <script>
        // Init Theme
        try {
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add("dark");
            }
        } catch (e) {}
    </script>
</head>

<!-- MENGGUNAKAN h-[100dvh] (Dynamic Viewport Height) agar tidak tertutup address bar hp saat landscape/portrait -->
<body class="h-[100dvh] w-screen flex flex-col bg-[hsl(var(--background))] text-[hsl(var(--foreground))] transition-colors duration-300 overflow-hidden">

    <!-- HEADER: Navigasi Board -->
    <header class="h-16 border-b border-[hsl(var(--border))] flex items-center justify-between px-4 sm:px-6 bg-[hsl(var(--background))] z-10 shadow-sm shrink-0">
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="w-8 h-8 rounded bg-chalk-green text-white flex items-center justify-center font-bold shrink-0">
                <i data-lucide="graduation-cap" class="w-5 h-5"></i>
            </div>
            <h1 class="font-semibold text-base sm:text-lg tracking-tight hidden sm:block">Fisika UNSERA</h1>
        </div>

        <!-- Board Navigator (30 Papan Tulis) -->
        <div class="flex items-center bg-[hsl(var(--muted))] border border-[hsl(var(--border))] rounded-md p-1">
            <button onclick="prevBoard()" class="inline-flex items-center justify-center h-8 w-8 rounded-sm text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--background))] hover:text-[hsl(var(--foreground))] hover:shadow-sm transition-all disabled:opacity-50" id="btn-prev">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <div class="px-2 sm:px-4 text-sm font-medium tabular-nums flex items-center justify-center min-w-[80px] sm:min-w-[90px]">
                Board <span id="current-board-label" class="ml-1 mr-1">1</span> / 30
            </div>
            <button onclick="nextBoard()" class="inline-flex items-center justify-center h-8 w-8 rounded-sm text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--background))] hover:text-[hsl(var(--foreground))] hover:shadow-sm transition-all disabled:opacity-50" id="btn-next">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
        </div>
        
        <div class="flex justify-end">
             <button onclick="clearBoard()" class="inline-flex items-center justify-center h-9 px-3 sm:px-4 rounded-md text-sm font-medium border border-[hsl(var(--border))] bg-transparent hover:bg-red-50 hover:text-red-600 dark:hover:bg-red-950/30 dark:hover:text-red-400 transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4 sm:mr-2"></i> <span class="hidden sm:inline">Bersihkan</span>
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE: Mengisi layar penuh secara dinamis namun tetap memberi ruang di atas & bawah -->
    <main class="flex-1 w-full relative overflow-hidden flex flex-col pt-4 pb-[5.5rem] sm:pt-6 sm:pb-24 bg-[hsl(var(--muted))]">
        
        <!-- PAPAN TULIS: 
             - w-full memastikan rata sisi kiri & kanan (100%)
             - flex-1 memastikan tinggi layar otomatis terisi secara dinamis (mengikuti batas pt & pb main di atas)
             - border-y memberikan efek pinggiran kayu di atas & bawah saja 
        -->
        <div class="board-canvas-wrapper board-light board-dark border-y-[10px] sm:border-y-[14px] md:border-y-[16px] border-x-0 border-chalk-border shadow-2xl flex-1 w-full" id="canvas-container">
            <canvas id="chalkboard"></canvas>
        </div>
        
    </main>

    <!-- FLOATING TOOLBAR: Bawah Tengah -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center p-1 rounded-full border border-[hsl(var(--border))] bg-[hsl(var(--background))] shadow-xl transition-all duration-300 max-w-[95vw]">
        
        <!-- Toggle Menu Button (Titik Satu) -->
        <button onclick="toggleToolbar()" id="btn-toggle-toolbar" class="relative inline-flex items-center justify-center w-12 h-12 rounded-full bg-[hsl(var(--foreground))] text-[hsl(var(--background))] hover:opacity-90 transition-transform active:scale-95 z-20 shrink-0 shadow-sm">
            <i data-lucide="more-horizontal" id="icon-menu" class="w-6 h-6 absolute transition-all duration-300"></i>
            <i data-lucide="x" id="icon-close" class="w-6 h-6 absolute opacity-0 scale-50 transition-all duration-300"></i>
        </button>

        <!-- Hidden Expandable Area (Tools, Size & Themes) -->
        <div id="expandable-tools" class="flex items-center max-w-0 opacity-0 px-0 overflow-x-auto hide-scrollbar transition-all duration-500 ease-in-out gap-1 z-10 shrink-0 scroll-smooth">
            
            <!-- Drawing Tools -->
            <button onclick="setTool('pen')" id="tool-pen" class="tool-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Pulpen (P)">
                <i data-lucide="pen" class="w-5 h-5"></i>
            </button>
            <button onclick="setTool('text')" id="tool-text" class="tool-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Teks / Ketik (T)">
                <i data-lucide="text-cursor-input" class="w-5 h-5"></i>
            </button>
            <button onclick="setTool('rect')" id="tool-rect" class="tool-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Kotak (R)">
                <i data-lucide="square" class="w-5 h-5"></i>
            </button>
            <button onclick="setTool('circle')" id="tool-circle" class="tool-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Lingkaran (C)">
                <i data-lucide="circle" class="w-5 h-5"></i>
            </button>
            <button onclick="setTool('eraser')" id="tool-eraser" class="tool-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Penghapus (E)">
                <i data-lucide="eraser" class="w-5 h-5"></i>
            </button>

            <!-- Divider -->
            <div class="w-[1px] h-6 bg-[hsl(var(--border))] mx-1 sm:mx-2 shrink-0"></div>

            <!-- Size / Thickness Slider -->
            <div class="flex items-center gap-2 px-2 shrink-0" title="Ketebalan / Ukuran Font">
                <i data-lucide="scaling" class="w-4 h-4 text-[hsl(var(--muted-foreground))]"></i>
                <input type="range" id="tool-size" min="1" max="50" value="4" class="w-16 sm:w-28" oninput="updateCanvasContextProps()">
            </div>

            <!-- Divider -->
            <div class="w-[1px] h-6 bg-[hsl(var(--border))] mx-1 sm:mx-2 shrink-0"></div>

            <!-- Theme Toggles -->
            <button onclick="setTheme('light')" id="btn-light" class="theme-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Light Mode">
                <i data-lucide="sun" class="h-4 w-4"></i>
            </button>
            <button onclick="setTheme('system')" id="btn-system" class="theme-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="System Mode">
                <i data-lucide="monitor" class="h-4 w-4"></i>
            </button>
            <button onclick="setTheme('dark')" id="btn-dark" class="theme-btn shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-full text-[hsl(var(--muted-foreground))] hover:bg-[hsl(var(--muted))] transition-colors" title="Dark Mode">
                <i data-lucide="moon" class="h-4 w-4"></i>
            </button>
        </div>
    </div>

    <!-- LOGIKA TEMA & RENDER ICON -->
    <script>
        lucide.createIcons();

        let isToolbarOpen = false;
        function toggleToolbar() {
            isToolbarOpen = !isToolbarOpen;
            const menuArea = document.getElementById('expandable-tools');
            const iconMenu = document.getElementById('icon-menu');
            const iconClose = document.getElementById('icon-close');
            
            if (isToolbarOpen) {
                menuArea.classList.add('toolbar-expanded');
                iconMenu.classList.add('opacity-0', 'scale-50');
                iconClose.classList.remove('opacity-0', 'scale-50');
            } else {
                menuArea.classList.remove('toolbar-expanded');
                iconMenu.classList.remove('opacity-0', 'scale-50');
                iconClose.classList.add('opacity-0', 'scale-50');
            }
        }

        function updateActiveThemeButton() {
            const theme = localStorage.getItem('theme') || 'system';
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
            });
            const activeBtn = document.getElementById(`btn-${theme}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
            }
        }

        function setTheme(mode) {
            const html = document.documentElement;
            if (mode === 'system') {
                localStorage.removeItem('theme');
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            } else {
                localStorage.theme = mode;
                if (mode === 'dark') {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            }
            updateActiveThemeButton();
            updateCanvasContextProps();
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('theme')) {
                if (e.matches) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                updateCanvasContextProps();
            }
        });

        updateActiveThemeButton();
    </script>

    <!-- LOGIKA PAPAN TULIS (CANVAS) -->
    <script>
        const canvas = document.getElementById('chalkboard');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const container = document.getElementById('canvas-container');

        // State Aplikasi
        const MAX_BOARDS = 30;
        let currentBoardIndex = 0;
        const boardsData = new Array(MAX_BOARDS).fill(null); 

        let isDrawing = false;
        let currentTool = 'pen';
        let startX, startY;
        let snapshot; 
        
        // Elemen input teks aktif
        let activeTextInput = null;

        // Setup Canvas Size Responsif (Tertrigger saat orientasi/resize device berubah)
        function resizeCanvas() {
            // Ambil coretan saat ini langsung dari canvas, bukan dari array, 
            // sehingga orientasi (portrait <-> landscape) tidak menghapus progres.
            const currentImgData = canvas.toDataURL(); 
            
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            updateCanvasContextProps();
            
            if (currentImgData !== "data:,") {
                const img = new Image();
                img.src = currentImgData;
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                    saveBoardState(); // update data array
                };
            }
        }

        window.addEventListener('resize', resizeCanvas);

        function updateCanvasContextProps() {
            const isDark = document.documentElement.classList.contains('dark');
            const toolSize = parseInt(document.getElementById('tool-size').value);
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = "destination-out";
                ctx.lineWidth = toolSize * 5; 
            } else {
                ctx.globalCompositeOperation = "source-over";
                ctx.lineWidth = toolSize;
                ctx.strokeStyle = isDark ? '#f8fafc' : '#0f172a'; 
            }
        }

        // TOOL UI UPDATE
        function setTool(tool) {
            // Jika ada input teks aktif, paksa selesai
            if (activeTextInput) {
                activeTextInput.blur();
            }
            
            currentTool = tool;
            updateCanvasContextProps();

            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
                btn.classList.add('text-[hsl(var(--muted-foreground))]');
            });
            
            const activeBtn = document.getElementById(`tool-${tool}`);
            if(activeBtn) {
                activeBtn.classList.remove('text-[hsl(var(--muted-foreground))]');
                activeBtn.classList.add('bg-[hsl(var(--muted))]', 'text-[hsl(var(--foreground))]');
            }
        }
        setTool('pen'); 

        // MOUSE / TOUCH EVENTS
        const getMousePos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        };

        const startDraw = (e) => {
            const pos = getMousePos(e);
            
            // Logika untuk Tool Teks 
            if (currentTool === 'text') {
                if (activeTextInput) return; 
                
                const input = document.createElement('textarea');
                input.className = 'canvas-text-input';
                
                const toolSize = parseInt(document.getElementById('tool-size').value);
                const fontSize = Math.max(16, toolSize * 4); 
                input.style.fontSize = fontSize + 'px';
                
                input.style.left = pos.x + 'px';
                input.style.top = pos.y + 'px'; 
                
                const isDark = document.documentElement.classList.contains('dark');
                input.style.color = isDark ? '#f8fafc' : '#0f172a';
                
                container.appendChild(input);
                activeTextInput = input;
                
                setTimeout(() => input.focus(), 10);
                
                const finalizeText = () => {
                    if (!activeTextInput) return;
                    const text = input.value;
                    if (text.trim() !== '') {
                        ctx.font = `${fontSize}px sans-serif`;
                        ctx.fillStyle = input.style.color;
                        ctx.textBaseline = 'top';
                        
                        const lines = text.split('\n');
                        const lineHeight = fontSize * 1.2;
                        lines.forEach((line, index) => {
                            ctx.fillText(line, pos.x + 4, pos.y + 4 + (index * lineHeight));
                        });
                        
                        saveBoardState();
                    }
                    input.remove();
                    activeTextInput = null;
                };

                input.addEventListener('blur', finalizeText);
                input.addEventListener('keydown', (ev) => {
                    if (ev.key === 'Enter' && !ev.shiftKey) {
                        ev.preventDefault();
                        finalizeText();
                    }
                });
                
                e.preventDefault();
                return;
            }

            isDrawing = true;
            startX = pos.x;
            startY = pos.y;
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            e.preventDefault();
        };

        const draw = (e) => {
            if (!isDrawing || currentTool === 'text') return;
            const pos = getMousePos(e);

            if (currentTool === 'pen' || currentTool === 'eraser') {
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentTool === 'rect' || currentTool === 'circle') {
                ctx.putImageData(snapshot, 0, 0);
                ctx.beginPath();
                if (currentTool === 'rect') {
                    ctx.rect(startX, startY, pos.x - startX, pos.y - startY);
                } else if (currentTool === 'circle') {
                    const radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
                    ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                }
                ctx.stroke();
            }
            e.preventDefault();
        };

        const stopDraw = (e) => {
            if (!isDrawing || currentTool === 'text') return;
            isDrawing = false;
            saveBoardState();
        };

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseout', stopDraw);

        // Native support touch (Tablet & Mobile)
        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDraw);

        // BOARD MANAGEMENT LOGIC
        function saveBoardState() {
            boardsData[currentBoardIndex] = canvas.toDataURL();
        }

        function restoreBoardState(dataUrl) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (dataUrl) {
                const img = new Image();
                img.src = dataUrl;
                img.onload = () => ctx.drawImage(img, 0, 0);
            }
        }

        function updateBoardUI() {
            document.getElementById('current-board-label').innerText = currentBoardIndex + 1;
            document.getElementById('btn-prev').disabled = currentBoardIndex === 0;
            document.getElementById('btn-next').disabled = currentBoardIndex === MAX_BOARDS - 1;
        }

        function nextBoard() {
            if (currentBoardIndex < MAX_BOARDS - 1) {
                saveBoardState();
                currentBoardIndex++;
                restoreBoardState(boardsData[currentBoardIndex]);
                updateBoardUI();
            }
        }

        function prevBoard() {
            if (currentBoardIndex > 0) {
                saveBoardState();
                currentBoardIndex--;
                restoreBoardState(boardsData[currentBoardIndex]);
                updateBoardUI();
            }
        }

        function clearBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveBoardState();
        }

        // Shortcuts Keyboard Update
        window.addEventListener('keydown', (e) => {
            if (activeTextInput && document.activeElement === activeTextInput) return;
            
            if (e.key.toLowerCase() === 'p') setTool('pen');
            if (e.key.toLowerCase() === 't') setTool('text');
            if (e.key.toLowerCase() === 'r') setTool('rect');
            if (e.key.toLowerCase() === 'c') setTool('circle');
            if (e.key.toLowerCase() === 'e') setTool('eraser');
            if (e.key === 'ArrowRight') nextBoard();
            if (e.key === 'ArrowLeft') prevBoard();
        });

        // INIT
        window.onload = () => {
            resizeCanvas();
            updateBoardUI();
        };
    </script>
</body>
</html>
